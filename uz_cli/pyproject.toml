[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ultrazohm"
version = "0.1.0"
requires-python = ">=3.10"
description = "Rust-powered UltraZohm acquisition and control"
dependencies = ["polars>=1"]
license = "Apache-2.0"

[project.scripts]
ultrazohm = "ultrazohm.cli:main"

[project.optional-dependencies]
examples = ["polars", "matplotlib"]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "ultrazohm._native"
