[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uz_scope"
version = "0.1.0"
description = "UltraZohm live scope GUI (JavaScope replacement) built with Dear ImGui (imgui_bundle / ImPlot)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "UltraZohm" }]
dependencies = [
    "uz_dataviewer>=0.1.0",
    "imgui-bundle>=1.6",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "glfw>=2.5; platform_system != 'Emscripten'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6.0"]

[project.scripts]
uz-scope = "uz_scope.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: spawns javascope/test_server.py as a subprocess",
]
