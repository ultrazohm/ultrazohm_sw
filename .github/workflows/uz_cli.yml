name: UltraZohm CLI and Data Viewer
# One pipeline, one version per run. CLI checks run on both systems; the CLI
# wheels are stamped and built once, and the viewer tests and both desktop
# bundles use exactly those wheels. Pushes to main (stable), develop and
# feature/uz_cli_dataviewer_testing (prereleases) publish one GitHub release
# with wheels and bundles, and upload the wheels to PyPI as ultrazohm_cli.
# Keep this file name: PyPI's trusted publisher names it, and versions use its
# run number (renaming the file restarts run numbers).

on:
  push:
    branches: ['**']
    paths:
      - 'uz_cli/**'
      - 'uz_dataviewer/**'
      - 'javascope/test_server.py'
      - 'vitis/software/**'
      - 'tcl_scripts/**'
      - '.github/workflows/uz_cli.yml'
      - '.github/workflows/ci-image.yml'
      - '.devcontainer/Dockerfile'
      - '.python-version'
      - 'docs/source/guide/gui/uz_dataviewer/uz_dataviewer_commands.csv'
  pull_request:
    paths:
      - 'uz_cli/**'
      - 'uz_dataviewer/**'
      - 'javascope/test_server.py'
      - 'vitis/software/**'
      - 'tcl_scripts/**'
      - '.github/workflows/uz_cli.yml'
      - '.github/workflows/ci-image.yml'
      - '.devcontainer/Dockerfile'
      - '.python-version'
      - 'docs/source/guide/gui/uz_dataviewer/uz_dataviewer_commands.csv'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: uz-cli-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  OPENBLAS_NUM_THREADS: '2'
  CARGO_BUILD_JOBS: 2

jobs:
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  cli-check-linux:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # Header provenance uses git; the checkout is owned by another user than the container's root.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uz_cli
          key: checks-linux
      - run: python3 uz_cli/tasks.py check

  cli-check-windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
      # Installs the toolchain pinned in uz_cli/rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: uz_cli
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uz_cli
          key: checks-windows-latest
      - run: python uz_cli/tasks.py check

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: uz_cli
      - id: version
        run: python3 uz_cli/tasks.py version

  wheel-linux:
    needs: [image, version]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      UZ_CLI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uz_cli
          key: release-linux
      - run: python3 uz_cli/tasks.py stamp "$UZ_CLI_RELEASE_VERSION"
      - run: python3 uz_cli/tasks.py release-wheel
      - run: python3 uz_cli/tasks.py release-check
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: uz_cli/target/wheels-release/*.whl
          if-no-files-found: error

  wheel-windows:
    needs: version
    runs-on: windows-2022
    env:
      UZ_CLI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
      - run: rustup toolchain install
        working-directory: uz_cli
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uz_cli
          key: release-windows
      - run: python uz_cli/tasks.py stamp "$env:UZ_CLI_RELEASE_VERSION"
      - run: python uz_cli/tasks.py release-wheel
      - run: python uz_cli/tasks.py release-check
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: uz_cli/target/wheels-release/*.whl
          if-no-files-found: error

  # Lint and the full suite, including live tests, against this run's wheel.
  viewer-test-linux:
    needs: [image, wheel-linux]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux
          path: cli-wheel
      - run: python3 uz_dataviewer/tasks.py check --cli-wheel cli-wheel/*.whl

  viewer-test-windows:
    needs: wheel-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uz_dataviewer/uv.lock
      - uses: actions/download-artifact@v4
        with:
          name: wheel-windows
          path: cli-wheel
      - run: uv run --no-project python uz_dataviewer/tasks.py check --cli-wheel (Get-ChildItem cli-wheel/*.whl).FullName

  bundle-linux:
    needs: [viewer-test-linux, wheel-linux, version]
    runs-on: ubuntu-24.04
    # Build and smoke-test on the oldest supported system (glibc 2.35).
    # PyInstaller bundles libstdc++, whose libc requirements also matter.
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and GUI runtime libraries
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates binutils libgl1 libx11-6 libxext6 libxau6 libxdmcp6 libxcb1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uz_dataviewer/uv.lock
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux
          path: cli-wheel
      - run: uv run --no-project python uz_dataviewer/tasks.py bundle --cli-wheel cli-wheel/*.whl
      - run: uv run --no-project python uz_dataviewer/tasks.py bundle-smoke
      - name: Package Linux executable
        run: |
          mkdir -p packages
          tar -C uz_dataviewer/dist -czf "packages/uz_dataviewer-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" uz_dataviewer
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  bundle-windows:
    needs: [viewer-test-windows, wheel-windows, version]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uz_dataviewer/uv.lock
      - uses: actions/download-artifact@v4
        with:
          name: wheel-windows
          path: cli-wheel
      - run: uv run --no-project python uz_dataviewer/tasks.py bundle --cli-wheel (Get-ChildItem cli-wheel/*.whl).FullName
      - run: uv run --no-project python uz_dataviewer/tasks.py bundle-smoke
      - name: Package Windows executable
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          Compress-Archive -Path uz_dataviewer\dist\uz_dataviewer -DestinationPath "packages\uz_dataviewer-${{ needs.version.outputs.version }}-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: packages/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    needs: [version, bundle-linux, bundle-windows, cli-check-linux, cli-check-windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{wheel,bundle}-*'
          path: packages
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=(*.whl *.tar.gz *.zip)
          test "${#files[@]}" -eq 4
          sha256sum "${files[@]}" > SHA256SUMS
          cat > release-notes.md <<EOF
          UltraZohm CLI and Data Viewer ${VERSION}.

          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          CLI and Python API: \`uv tool install ultrazohm_cli==${VERSION}\` (Python 3.10+, Windows x86-64, Linux x86-64 with glibc 2.28+).
          Data Viewer: extract the archive and run uz_dataviewer; it bundles this CLI. Linux needs glibc 2.35+ and desktop graphics libraries.
          Verify downloads against SHA256SUMS.
          EOF
          # A rerun resumes an incomplete draft, but leaves a published release intact.
          if state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$state" == false ]]; then
              echo "Release $TAG is already published."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "UltraZohm $VERSION" --notes-file release-notes.md \
              --prerelease="$PRERELEASE" --latest=false
          fi
          gh release upload "$TAG" "${files[@]}" SHA256SUMS --clobber
          # Never replace the repository's latest firmware/software release.
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest=false

  pypi:
    needs: [version, bundle-linux, bundle-windows, cli-check-linux, cli-check-windows]
    if: needs.version.outputs.publish == 'true' && github.repository == 'ultrazohm/ultrazohm_sw'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # Trusted publishing: PyPI trusts this workflow file and the pypi environment.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
