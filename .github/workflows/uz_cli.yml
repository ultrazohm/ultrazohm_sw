name: UltraZohm CLI and Data Viewer
# One pipeline, one version per run. CLI checks run on both systems; the CLI
# wheels are stamped and built once, and the viewer tests and Windows desktop
# bundles use exactly those wheels. Pushes to main (stable), develop and
# feature/uz_cli_dataviewer_testing (prereleases) publish one GitHub release
# with wheels and bundles, and upload both packages to PyPI.
# Keep this file name: PyPI's trusted publisher names it, and versions use its
# run number (renaming the file restarts run numbers).

on:
  push:
    branches: ['**']
    paths:
      - 'uz'
      - 'uz.ps1'
      - 'tasks.py'
      - 'tests/**'
      - 'scripts/**'
      - 'ultrazohm_cli/**'
      - 'ultrazohm_dataviewer/**'
      - 'javascope/test_server.py'
      - 'vitis/software/**'
      - 'tcl_scripts/**'
      - '.github/workflows/uz_cli.yml'
      - '.github/workflows/ci-image.yml'
      - '.devcontainer/Dockerfile'
      - '.python-version'
      - 'docs/source/guide/gui/ultrazohm_dataviewer/ultrazohm_dataviewer_commands.csv'
  pull_request:
    paths:
      - 'uz'
      - 'uz.ps1'
      - 'tasks.py'
      - 'tests/**'
      - 'scripts/**'
      - 'ultrazohm_cli/**'
      - 'ultrazohm_dataviewer/**'
      - 'javascope/test_server.py'
      - 'vitis/software/**'
      - 'tcl_scripts/**'
      - '.github/workflows/uz_cli.yml'
      - '.github/workflows/ci-image.yml'
      - '.devcontainer/Dockerfile'
      - '.python-version'
      - 'docs/source/guide/gui/ultrazohm_dataviewer/ultrazohm_dataviewer_commands.csv'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: uz-cli-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  OPENBLAS_NUM_THREADS: '2'
  CARGO_BUILD_JOBS: 2

jobs:
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  cli-check-linux:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # Header provenance uses git; the checkout is owned by another user than the container's root.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ultrazohm_cli
          key: checks-linux
      - run: ./uz check cli

  cli-check-windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
      # Installs the toolchain pinned in ultrazohm_cli/rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: ultrazohm_cli
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ultrazohm_cli
          key: checks-windows-latest
      - run: .\uz.ps1 check cli

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: ./uz task cli version

  wheel-linux:
    needs: [image, version]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      UZ_CLI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ultrazohm_cli
          key: release-linux
      - run: ./uz task cli release-wheel
      - run: ./uz task cli release-check
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: ultrazohm_cli/target/wheels-release/*.whl
          if-no-files-found: error

  wheel-windows:
    needs: version
    runs-on: windows-2022
    env:
      UZ_CLI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
      - run: rustup toolchain install
        working-directory: ultrazohm_cli
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ultrazohm_cli
          key: release-windows
      - run: .\uz.ps1 task cli release-wheel
      - run: .\uz.ps1 task cli release-check
      - run: .\uz.ps1 task cli standalone
      - run: .\ultrazohm_cli\target\release\ultrazohm-cli.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: native-cli-windows
          path: ultrazohm_cli/target/release/ultrazohm-cli.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: ultrazohm_cli/target/wheels-release/*.whl
          if-no-files-found: error

  wheel-viewer:
    needs: version
    runs-on: ubuntu-latest
    env:
      UZ_CLI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.1'
      - run: ./uz task viewer wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-viewer
          path: ultrazohm_dataviewer/dist-wheels/*.whl
          if-no-files-found: error

  # Lint and the full suite, including live tests, against this run's wheel.
  viewer-test-linux:
    needs: [image, wheel-linux, wheel-viewer]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux
          path: cli-wheel
      - uses: actions/download-artifact@v4
        with:
          name: wheel-viewer
          path: viewer-wheel
      - run: ./uz check viewer --cli-wheel cli-wheel/*.whl --viewer-wheel viewer-wheel/*.whl

  viewer-test-windows:
    needs: [wheel-windows, wheel-viewer]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: ultrazohm_dataviewer/uv.lock
      - uses: actions/download-artifact@v4
        with:
          name: wheel-windows
          path: cli-wheel
      - uses: actions/download-artifact@v4
        with:
          name: wheel-viewer
          path: viewer-wheel
      - run: .\uz.ps1 check viewer --cli-wheel (Get-ChildItem cli-wheel/*.whl).FullName --viewer-wheel (Get-ChildItem viewer-wheel/*.whl).FullName

  bundle-windows:
    needs: [viewer-test-windows, wheel-windows, wheel-viewer, version]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: ultrazohm_dataviewer/uv.lock
      - uses: actions/download-artifact@v4
        with:
          name: wheel-windows
          path: cli-wheel
      - uses: actions/download-artifact@v4
        with:
          name: wheel-viewer
          path: viewer-wheel
      - run: .\uz.ps1 build viewer --cli-wheel (Get-ChildItem cli-wheel/*.whl).FullName --viewer-wheel (Get-ChildItem viewer-wheel/*.whl).FullName
      - run: .\uz.ps1 task viewer bundle-smoke
      - uses: actions/download-artifact@v4
        with:
          name: native-cli-windows
          path: native-cli
      - name: Package Windows applications
        run: uv run --no-project --python 3.12 scripts/package_windows.py --version "${{ needs.version.outputs.version }}" --cli native-cli/ultrazohm-cli.exe --viewer ultrazohm_dataviewer/dist/ultrazohm-dataviewer --output packages
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: packages/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    needs: [version, verify-published, viewer-test-linux, bundle-windows, cli-check-linux, cli-check-windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '{wheel,bundle}-*'
          path: packages
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=(*.whl *.zip)
          python3 ../scripts/release_manifest.py . "$VERSION"
          cat > release-notes.md <<EOF
          UltraZohm CLI and Data Viewer ${VERSION}.

          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          CLI and Python API: \`uv tool install ultrazohm-cli==${VERSION}\` (Python 3.10+, Windows x86-64, Linux x86-64 with glibc 2.28+).
          Data Viewer: \`uvx ultrazohm-dataviewer==${VERSION}\`. Windows users can also extract the ZIP and run ultrazohm-dataviewer.exe. Linux uses the Python packages; no standalone archive is provided.
          Verify downloads against SHA256SUMS.
          EOF
          # A rerun resumes an incomplete draft, but leaves a published release intact.
          if state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$state" == false ]]; then
              echo "Release $TAG is already published."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "UltraZohm $VERSION" --notes-file release-notes.md \
              --prerelease="$PRERELEASE" --latest=false
          fi
          gh release upload "$TAG" "${files[@]}" SHA256SUMS manifest.json --clobber
          # Never replace the repository's latest firmware/software release.
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest=false

  pypi:
    needs: [version, viewer-test-linux, bundle-windows, cli-check-linux, cli-check-windows]
    if: needs.version.outputs.publish == 'true' && github.repository == 'ultrazohm/ultrazohm_sw'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: |
          mkdir cli-dist viewer-dist
          mv dist/ultrazohm_cli-*.whl cli-dist/
          mv dist/ultrazohm_dataviewer-*.whl viewer-dist/
      # Trusted publishing: PyPI trusts this workflow file and the pypi environment.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli-dist/
          skip-existing: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: viewer-dist/
          skip-existing: true

  verify-published:
    needs: [version, pypi]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.1'
      - run: uv run --no-project --python 3.12 scripts/verify_published.py "${{ needs.version.outputs.version }}"
