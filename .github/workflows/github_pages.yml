name: documentation

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Use the Python 3.12 interpreter supplied by the development container.
    container:
      image: ultrazohm/ultrazohm_remote_container_new:9750fb1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
      - name: Install dependencies
        run: |
          python -m pip install -r docs/requirements.txt
      - name: sphinx build
        run: |
          cd docs
          make docs
      - name: Fix permissions
        run: |
          ls
          chmod -c -R +rX "docs/build/html/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
            done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/html

# Deploy job
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Add a dependency to the build job
    needs: build

    # Serialize deployments without interrupting one already in progress.
    concurrency:
      group: pages
      cancel-in-progress: false

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
