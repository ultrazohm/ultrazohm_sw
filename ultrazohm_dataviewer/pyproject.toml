[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrazohm-dataviewer"
version = "0.1.0"
description = "UltraZohm log data viewer built with Dear ImGui (imgui_bundle / ImPlot)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "UltraZohm" }]
# Compatible ranges for library use; uv.lock pins the exact versions that
# development, CI and the frozen desktop bundles use.
dependencies = [
    "imgui-bundle>=1.93,<2",
    "numpy>=2.2,<3",
    "polars>=2.0,<3",
    # Window file drag-drop (GLFW backend); a no-op if absent.
    "glfw>=2.8,<3",
    # Exact: release builds stamp both packages to the shared release version.
    "ultrazohm-cli==0.1.0",
]

[project.optional-dependencies]
# Dataset.to_dataframe().to_pandas() conversions.
pandas = ["pandas>=2.2", "pyarrow>=15"]
dev = ["pytest>=7", "pyinstaller>=6.0", "ruff==0.17.2"]

[project.scripts]
ultrazohm-dataviewer = "ultrazohm_dataviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultrazohm_dataviewer = ["assets/*.svg", "assets/app_settings/*.png", "assets/app_settings/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
required-version = "==0.17.2"
target-version = "py312"
line-length = 88
extend-exclude = ["target", "dist", "dist-wheels"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I", "B", "UP", "C4"]

# Developer resolution uses the checkout; published wheel metadata retains
# the exact version dependency and never includes this local source path.
[tool.uv.sources]
ultrazohm-cli = { path = "../ultrazohm_cli" }
