name: CI image

# Builds the `ci` stage of the development container and publishes it to GHCR,
# tagged by the build-input content hash. Unchanged build inputs reuses the
# published image, so CLI and viewer jobs run in the same toolchain that
# developers use in the dev container.
on:
  workflow_call:
    outputs:
      image:
        description: Image reference for container jobs
        value: ${{ jobs.image.outputs.image }}

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .devcontainer
      - name: Derive image tag from pinned inputs and refresh revision
        id: tag
        shell: bash
        run: |
          hash="$(sha256sum .devcontainer/Dockerfile .devcontainer/build-tools.txt .devcontainer/ci-image-revision | sha256sum | cut -c1-12)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/ultrazohm-ci:${hash}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for a published image
        id: published
        shell: bash
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject unpublished images from forks
        if: >-
          steps.published.outputs.exists != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::The Dockerfile changed, but fork pull requests cannot publish the CI image. Push the Dockerfile change from a branch of this repository first."
          exit 1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.published.outputs.exists != 'true'
      - name: Build and push the ci stage
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          target: ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      - name: Resolve immutable image reference
        id: digest
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker pull "$IMAGE"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")" >> "$GITHUB_OUTPUT"
