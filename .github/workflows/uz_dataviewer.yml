name: Data viewer binaries

on:
  push:
    branches: ['**']
    paths:
      - 'uz_dataviewer/**'
      - 'uz_cli/**'
      - '.github/actions/test-cli-wheel/**'
      - 'javascope/test_server.py'
      - 'vitis/software/**'
      - 'tcl_scripts/**'
      - '.github/workflows/uz_dataviewer.yml'
      - 'docs/source/guide/gui/uz_dataviewer/uz_dataviewer_commands.csv'
  pull_request:
    paths:
      - 'uz_dataviewer/**'
      - 'uz_cli/**'
      - '.github/actions/test-cli-wheel/**'
      - 'javascope/test_server.py'
      - 'vitis/software/**'
      - 'tcl_scripts/**'
      - '.github/workflows/uz_dataviewer.yml'
      - 'docs/source/guide/gui/uz_dataviewer/uz_dataviewer_commands.csv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataviewer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PROJECT_ENVIRONMENT: .venv-build
  PYTHONUTF8: '1'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  cli-wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/test-cli-wheel
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-cli-${{ matrix.os }}
          path: dist/*.whl

  test:
    runs-on: ubuntu-24.04
    container: python:3.12-slim-bookworm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: uz_dataviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GUI runtime libraries
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libgl1 libx11-6 libxext6 libxau6 libxdmcp6 libxcb1 nodejs
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uz_dataviewer/uv.lock
      - name: Install locked test dependencies
        run: uv sync --locked --extra dev --python 3.12 --no-build-package imgui-bundle
      - name: Check Python sources
        run: uv run --no-sync ruff check src tests build examples launch.py
      - name: Test
        run: uv run --no-sync python -m pytest -q

  test-web:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: uz_dataviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
      - name: Generate browser app
        run: python build/gen_web.py
      - name: Install browser test runtime
        run: |
          uv venv .venv-web --python 3.12
          uv pip install --python .venv-web/bin/python playwright==1.64.1
          .venv-web/bin/python -m playwright install --with-deps chromium
      - name: Smoke-test Pyodide in Chromium
        run: .venv-web/bin/python build/smoke_web.py

  build-linux:
    needs: [test, cli-wheels]
    runs-on: ubuntu-24.04
    # Build against glibc 2.36, rather than the host runner's newer libc.
    container: python:3.12-slim-bookworm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: uz_dataviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and GUI runtime libraries
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends binutils libgl1 libx11-6 libxext6 libxau6 libxdmcp6 libxcb1 nodejs
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uz_dataviewer/uv.lock
      - uses: actions/download-artifact@v4
        with:
          name: bundled-cli-ubuntu-22.04
          path: cli-wheels
      - name: Select matching CLI wheel
        run: echo "UZ_CLI_WHEEL=$(find "$GITHUB_WORKSPACE/cli-wheels" -name '*.whl')" >> "$GITHUB_ENV"
      - name: Build executable
        run: bash build/build_native.sh
      - name: Test viewer with matching native backend
        run: |
          uv run --no-sync python -c "import ultrazohm; from ultrazohm import Client, Acquisition"
          uv run --no-sync python -m pytest -q
      - name: Smoke-test frozen executable
        run: uv run --no-sync python build/smoke_binary.py dist/uz_dataviewer/uz_dataviewer
      - name: Test packaged live workers
        run: uv run --no-sync python build/smoke_live.py dist/uz_dataviewer/uz_dataviewer
      - name: Package Linux executable
        run: |
          mkdir -p packages
          tar -C dist -czf "packages/uz_dataviewer-${GITHUB_SHA}-linux-x86_64.tar.gz" uz_dataviewer
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: uz-dataviewer-linux
          path: uz_dataviewer/packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-windows:
    needs: [test, cli-wheels]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: uz_dataviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uz_dataviewer/uv.lock
      - name: Install locked test dependencies
        run: |
          uv sync --locked --extra dev --python 3.12 --no-build-package imgui-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test on Windows
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: bundled-cli-windows-2022
          path: cli-wheels
      - name: Select matching CLI wheel
        run: '"UZ_CLI_WHEEL=$((Get-ChildItem "$env:GITHUB_WORKSPACE/cli-wheels/*.whl").FullName)" >> $env:GITHUB_ENV'
      - name: Build executable
        run: .\build\build_native.ps1
      - name: Test viewer with matching native backend
        run: |
          uv run --no-sync python -c "import ultrazohm; from ultrazohm import Client, Acquisition"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test frozen executable
        run: |
          uv run --no-sync python build/smoke_binary.py dist/uz_dataviewer/uz_dataviewer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged live workers
        run: |
          uv run --no-sync python build/smoke_live.py dist/uz_dataviewer/uz_dataviewer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows executable
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          Compress-Archive -Path dist\uz_dataviewer -DestinationPath "packages\uz_dataviewer-$env:GITHUB_SHA-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: uz-dataviewer-windows
          path: uz_dataviewer/packages/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    needs: [build-linux, build-windows, test-web]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/uz_cli_dataviewer_testing')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: uz-dataviewer-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bundled-cli-*
          path: packages
          merge-multiple: true
      - name: Publish binary release
        shell: bash
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="uz-dataviewer-build-${GITHUB_RUN_ID}"
          linux_archive="uz_dataviewer-${GITHUB_SHA}-linux-x86_64.tar.gz"
          windows_archive="uz_dataviewer-${GITHUB_SHA}-windows-x86_64.zip"
          test -s "$linux_archive"
          test -s "$windows_archive"
          printf '{"source_commit":"%s","branch":"%s","service_api_version":1}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > manifest.json
          sha256sum "$linux_archive" "$windows_archive" *.whl manifest.json > SHA256SUMS
          prerelease=true
          if [[ "$GITHUB_REF_NAME" == main ]]; then prerelease=false; fi
          cat > release-notes.md <<EOF
          UltraZohm Data Viewer with bundled CLI and matching standalone Python wheels.

          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Linux: x86_64, glibc 2.36+ (Debian 12 / Ubuntu 24.04 or newer), with desktop graphics libraries.
          Windows: x86_64. Extract the ZIP before running the executable.
          Python and uv are not required on the target computer.
          Verify downloads against the attached SHA256SUMS file.
          EOF
          # A rerun resumes an incomplete draft, but leaves a published release intact.
          if gh release view "$release_tag" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [[ "$(cat release-state.txt)" == false ]]; then
              echo "Release $release_tag is already published."
              exit 0
            fi
          else
            gh release create "$release_tag" --target "$GITHUB_SHA" --draft \
              --title "UltraZohm Data Viewer ${GITHUB_SHA:0:7}" \
              --notes-file release-notes.md --prerelease="$prerelease" --latest=false
          fi
          gh release upload "$release_tag" "$linux_archive" "$windows_archive" *.whl manifest.json SHA256SUMS --clobber
          gh release edit "$release_tag" --draft=false --prerelease="$prerelease" --latest=false
