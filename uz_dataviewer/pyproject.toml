[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uz_dataviewer"
version = "0.1.0"
description = "UltraZohm log data viewer built with Dear ImGui (imgui_bundle / ImPlot)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "UltraZohm" }]
# Native versions validated by the lockfile and frozen builds. The browser build
# embeds sources and uses its separately pinned Pyodide ABI/package index.
dependencies = [
    "imgui-bundle==1.93.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "polars==2.0.0; platform_system != 'Emscripten'",
    # Native-only window file drag-drop (GLFW backend); a no-op if absent.
    "glfw==2.11.0; platform_system != 'Emscripten'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6.0", "ruff==0.17.2"]

[project.scripts]
uz-dataviewer = "uz_dataviewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["F"]
