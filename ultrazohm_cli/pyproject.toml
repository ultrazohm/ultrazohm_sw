[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "ultrazohm-cli"
version = "0.1.0"
requires-python = ">=3.10"
description = "Rust-powered UltraZohm acquisition and control"
dependencies = ["polars>=1"]
license = "Apache-2.0"

[project.scripts]
ultrazohm-cli = "ultrazohm_cli.cli:main"

[project.optional-dependencies]
examples = ["polars", "matplotlib"]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "ultrazohm_cli._native"

[tool.ruff]
required-version = "==0.17.2"
target-version = "py310"
line-length = 88
extend-exclude = ["target", "dist", "dist-wheels"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I", "B", "UP", "C4"]
