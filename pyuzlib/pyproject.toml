[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuzlib"
version = "0.1.0"
description = "Python utilities for UltraZohm."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "UltraZohm Community" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyuzlib*"]
