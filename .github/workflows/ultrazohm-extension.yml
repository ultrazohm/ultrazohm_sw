name: ultrazohm-extension
# Keep this filename: Trusted Publishing and version run numbers depend on it.

on:
  push:
    branches: [main, develop, feature/vscode-extension]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/ci-image.yml'
      - '.gitattributes'
      - 'ultrazohm-extension/**'
      - 'uz'
      - 'uz.ps1'
      - 'uz.py'
      - 'uz_bootstrap.*'
      - 'uz_shell.py'
      - 'test_uz_shell.py'
      - 'uz_venv.py'
      - 'requirements.txt'
      - '.python-version'
      - '.uv-version'
      - '.github/workflows/ultrazohm-extension.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/ci-image.yml'
      - '.gitattributes'
      - 'ultrazohm-extension/**'
      - 'uz'
      - 'uz.ps1'
      - 'uz.py'
      - 'uz_bootstrap.*'
      - 'uz_shell.py'
      - 'test_uz_shell.py'
      - 'uz_venv.py'
      - 'requirements.txt'
      - '.python-version'
      - '.uv-version'
      - '.github/workflows/ultrazohm-extension.yml'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish a prerelease from develop or feature/vscode-extension after all checks pass
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: ultrazohm-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: ultrazohm-extension

env:
  PYTHONDONTWRITEBYTECODE: '1'
  UZ_EXTENSION_PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease }}

jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: meta
        run: python3 tools/release.py metadata >> "$GITHUB_OUTPUT"

  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  package_cross_windows:
    needs: image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      UZ_BUILD_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make extension-build TARGET=win32-x64
      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-cross-windows
          path: ultrazohm-extension/dist/diagnostics
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cross-win32-x64
          path: ultrazohm-extension/dist/*.vsix
          if-no-files-found: error

  build_linux:
    name: Build and test (linux-x64)
    needs: image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      UZ_BUILD_IMAGE: ${{ needs.image.outputs.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Package and verify in isolated build directory
        run: make extension-test
      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-linux
          path: ultrazohm-extension/dist/diagnostics
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ultrazohm-extension-linux-x64
          path: ultrazohm-extension/dist/*
          if-no-files-found: error
          retention-days: 14

  build_windows:
    name: Build and test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: ultrazohm-extension/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Stamp version for this workflow run
        id: meta
        run: python tools/release.py metadata --stamp >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python -m unittest discover -s .. -p "test_uz_shell.py"
      - name: Fetch verified runtime and notices
        env:
          TARGET: ${{ matrix.target }}
        run: python tools/bundle.py --target "$TARGET"
      - name: Test bundled serial transport
        run: python -m unittest discover -s tools -p "test_serial.py"
      - name: Package platform VSIX
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRE_RELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          mkdir -p dist
          flags=()
          if [[ "$PRE_RELEASE" == true ]]; then flags+=(--pre-release); fi
          npm run package -- --target "$TARGET" --out "dist/ultrazohm-extension-$TARGET-$VERSION.vsix" "${flags[@]}"
      - name: Verify runtime and published command contracts
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRE_RELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          channel=stable
          if [[ "$PRE_RELEASE" == true ]]; then channel=prerelease; fi
          python tools/release.py verify --target "$TARGET" --vsix "dist/ultrazohm-extension-$TARGET-$VERSION.vsix" --extract .package-test --smoke-channel "$channel"
      - name: Test packaged extension (minimum supported VS Code)
        env:
          VSCODE_TEST_VERSION: '1.93.0'
          UZ_EXTENSION_TEST_PATH: .package-test/extension
          UZ_TEST_RECEIPT: dist/ultrazohm-extension-${{ matrix.target }}-${{ steps.meta.outputs.version }}.json
        run: npm run test:host
      - name: Test packaged extension (stable VS Code)
        env:
          VSCODE_TEST_VERSION: stable
          UZ_EXTENSION_TEST_PATH: .package-test/extension
          UZ_TEST_RECEIPT: dist/ultrazohm-extension-${{ matrix.target }}-${{ steps.meta.outputs.version }}.json
        run: npm run test:host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ultrazohm-extension-${{ matrix.target }}
          path: ultrazohm-extension/dist/*
          if-no-files-found: error
          retention-days: 14

  verify_cross_windows:
    name: Verify Linux-produced Windows VSIX
    needs: [package_cross_windows, image]
    env:
      UZ_BUILD_IMAGE: ${{ needs.image.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: ultrazohm-extension/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Stamp version for this workflow run
        id: meta
        run: python tools/release.py metadata --stamp >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python -m unittest discover -s .. -p "test_uz_shell.py"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cross-win32-x64
          path: ultrazohm-extension/dist
      - name: Verify runtime and published command contracts
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRE_RELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          channel=stable
          if [[ "$PRE_RELEASE" == true ]]; then channel=prerelease; fi
          python tools/release.py verify --target "$TARGET" --vsix "dist/ultrazohm-extension-$TARGET-$VERSION.vsix" --extract .package-test --smoke-channel "$channel"
      - name: Test packaged extension (minimum supported VS Code)
        env:
          VSCODE_TEST_VERSION: '1.93.0'
          UZ_EXTENSION_TEST_PATH: .package-test/extension
          UZ_TEST_RECEIPT: dist/ultrazohm-extension-${{ matrix.target }}-${{ steps.meta.outputs.version }}.json
        run: npm run test:host
      - name: Test packaged extension (stable VS Code)
        env:
          VSCODE_TEST_VERSION: stable
          UZ_EXTENSION_TEST_PATH: .package-test/extension
          UZ_TEST_RECEIPT: dist/ultrazohm-extension-${{ matrix.target }}-${{ steps.meta.outputs.version }}.json
        run: npm run test:host

  release:
    name: GitHub Release
    needs: [metadata, build_linux, build_windows, verify_cross_windows]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ultrazohm-extension-*
          merge-multiple: true
          path: ultrazohm-extension/dist
      - id: meta
        run: python tools/release.py metadata --stamp >> "$GITHUB_OUTPUT"
      - run: python tools/release.py manifest dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRE_RELEASE: ${{ steps.meta.outputs.prerelease }}
        run: python tools/publish-release.py

  marketplace:
    name: VS Code Marketplace
    needs: [metadata, release]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # No GitHub environment: matches the publisher's Trusted Publishing policy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ultrazohm-extension-*
          merge-multiple: true
          path: ultrazohm-extension/dist
      - run: npm ci
      - id: meta
        run: python tools/release.py metadata --stamp >> "$GITHUB_OUTPUT"
      - name: Verify tested artifacts
        run: python tools/release.py manifest dist
      - name: Publish both platform packages
        env:
          PRE_RELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRE_RELEASE" == true ]]; then flags+=(--pre-release); fi
          # Upload the tested VSIXs; do not package again during publishing.
          # A failed job can be retried if one platform was already accepted.
          npx --no-install vsce publish --oidc --skip-duplicate "${flags[@]}" --packagePath dist/*.vsix

      - name: Check public availability for both targets
        run: python tools/check-marketplace.py
