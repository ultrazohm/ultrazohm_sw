[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uz-dataviewer"
version = "0.1.0"
description = "UltraZohm data viewer for javascope log files (csv/parquet) built with imgui_bundle"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "UltraZohm developers" }]
dependencies = [
    "imgui-bundle>=1.92",
    "numpy>=1.24",
    "pyarrow>=14",
]

[project.optional-dependencies]
# Fast Rust MinMaxLTTB downsampling (same core as plotly-resampler).
# Not available on pyodide/web; a numpy fallback is built in.
fast = ["tsdownsample>=0.1.3"]
dev = [
    "pytest>=7",
    "tsdownsample>=0.1.3",
]
build = ["pyinstaller>=6"]

[project.scripts]
uz-dataviewer = "uz_dataviewer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uz_dataviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
